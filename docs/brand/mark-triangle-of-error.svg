<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="arbitra">
  <!-- arbitra primary mark - Triangle of Error
       Three sight lines that fail to meet. Each line contains exactly one edge
       of the error triangle; the true position lies inside the disagreement.
       Construction on a 32 unit grid, every vertex a whole number:
         error triangle  P1 (12,11)  P2 (21,14)  P3 (16,19)
         line 1  (3,8)  -> (30,17)   slope  1/3   contains P1-P2
         line 2  (26,9) -> (10,25)   slope -1     contains P2-P3
         line 3  (10,7) -> (19,25)   slope  2     contains P3-P1
         stations 3.2 squares centred on one endpoint of each line -->
  <g fill="none" stroke="#7D93A8" stroke-width="2">
    <path d="M3 8 L30 17"/>
    <path d="M26 9 L10 25"/>
    <path d="M10 7 L19 25"/>
  </g>
  <g fill="#7D93A8">
    <rect x="1.4" y="6.4" width="3.2" height="3.2"/>
    <rect x="24.4" y="7.4" width="3.2" height="3.2"/>
    <rect x="17.4" y="23.4" width="3.2" height="3.2"/>
  </g>
  <path d="M12 11 L21 14 L16 19 Z" fill="#C0873C"/>
</svg>
